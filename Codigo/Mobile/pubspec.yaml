name: medica_mobile
description: "Medica Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  device_info_plus: ^11.5.0
  mobile_scanner: ^6.0.3
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  device_preview: ^1.2.0
  flutter_svg: ^2.3.0
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/imgs/
